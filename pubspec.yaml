name: focusforge
description: "A Regain-style, Flutter-native, Android-first Focus & Study App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.2
  path: ^1.8.3
  image_picker: ^1.0.7
  fl_chart: ^0.68.0
  table_calendar: ^3.1.1
  just_audio: ^0.9.39
  animations: ^2.0.11
  lottie: ^3.1.2
  flutter_local_notifications: ^17.2.4
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  pigeon: ^17.2.1
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/lottie/
